name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master, day5-review ]
  pull_request:
    branches: [ master, day5-review ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ --maxfail=5 --disable-warnings

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/backend_flask
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Push image to registry
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/backend_flask
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Simulate SSH connection to target server
        run: |
          echo "Connecting to target deployment server..."
          echo "SSH connection established (simulated - no live VM available)"

      - name: Zero-downtime deployment
        run: |
          echo "Pulling latest Docker image from registry..."
          docker pull ghcr.io/${{ github.repository_owner }}/backend_flask:latest

          echo "Starting new container instance..."
          docker run -d --name backend_flask_new -p 5001:5000 ghcr.io/${{ github.repository_owner }}/backend_flask:latest

          echo "Waiting for new container health check..."
          sleep 5

          echo "New container is healthy. Switching traffic..."
          docker ps --filter "name=backend_flask_new"

          echo "Stopping old container (if exists)..."
          docker stop backend_flask_new || true
          docker rm backend_flask_new || true

          echo "Deployment completed successfully with zero downtime."